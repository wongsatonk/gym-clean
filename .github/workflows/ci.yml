name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check

  # The e2e run used to be one 27-minute job: the parallel phase, then the two camera phases one
  # test at a time (playwright.config.ts). Each phase now gets its own runner at the same time, and
  # the parallel phase is sharded, so the wall time is the slowest job instead of the sum. Every
  # test still runs exactly once: shards 1-4 cover `mobile` + `pwa`, one job for the live camera,
  # and the wall-clock clip specs (one 20-min job on 2026-11-17) split over 8 runners. `--no-deps`:
  # each runs alone on its own runner, which is what the phase order was protecting.
  # The fake camera video (2 MB MJPEG, made from a committed synthetic clip by ffmpeg) is built once
  # and cached; e2e jobs restore it, so none of them installs ffmpeg (apt took 7-12 min a job on
  # 2026-11-18). It is rebuilt only when the clip or the setup script changes.
  fake-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: test-results/fake-camera/person.mjpeg
          key: fake-camera-${{ hashFiles('fixtures/synthetic/curl/synthetic-01__reps-3__partials-1.webm', 'e2e/fake-camera.setup.ts') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the fake camera video
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p test-results/fake-camera
          ffmpeg -y -loglevel error -i fixtures/synthetic/curl/synthetic-01__reps-3__partials-1.webm -vf scale=480:640 -q:v 5 -r 30 test-results/fake-camera/person.mjpeg

  e2e:
    needs: fake-camera
    runs-on: ubuntu-latest
    # Playwright's image has Chromium and its system libraries, so no `install --with-deps` (apt).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: parallel-1, args: '--project=mobile --project=pwa --shard=1/4' }
          - { name: parallel-2, args: '--project=mobile --project=pwa --shard=2/4' }
          - { name: parallel-3, args: '--project=mobile --project=pwa --shard=3/4' }
          - { name: parallel-4, args: '--project=mobile --project=pwa --shard=4/4' }
          - { name: person-camera, args: '--project=mobile-person-camera --no-deps' }
          - { name: clips-1, args: '--project=mobile-clips --no-deps --shard=1/8' }
          - { name: clips-2, args: '--project=mobile-clips --no-deps --shard=2/8' }
          - { name: clips-3, args: '--project=mobile-clips --no-deps --shard=3/8' }
          - { name: clips-4, args: '--project=mobile-clips --no-deps --shard=4/8' }
          - { name: clips-5, args: '--project=mobile-clips --no-deps --shard=5/8' }
          - { name: clips-6, args: '--project=mobile-clips --no-deps --shard=6/8' }
          - { name: clips-7, args: '--project=mobile-clips --no-deps --shard=7/8' }
          - { name: clips-8, args: '--project=mobile-clips --no-deps --shard=8/8' }
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Fake camera video (built by the fake-camera job)
        uses: actions/cache/restore@v4
        with:
          path: test-results/fake-camera/person.mjpeg
          key: fake-camera-${{ hashFiles('fixtures/synthetic/curl/synthetic-01__reps-3__partials-1.webm', 'e2e/fake-camera.setup.ts') }}
          fail-on-cache-miss: true
      - run: npx playwright test ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
