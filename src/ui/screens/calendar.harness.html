<!doctype html>
<!-- Dev-only visual check for the M12 Calendar (task 12) and Share month image (task 13), with
     made-up data from calendarFixture.ts. Not part of the build or the app. Open on the dev server:
     /src/ui/screens/calendar.harness.html?view=month | ?view=day&date=2026-11-06 | ?view=share -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calendar harness</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import '@fontsource/barlow-condensed/latin-700.css';
      import '@fontsource/barlow/latin-400.css';
      import '@fontsource/barlow/latin-600.css';
      import '@fontsource/barlow/latin-700.css';
      import { calendarScreen } from './calendar.ts';
      import { calendarDayScreen } from './calendarDay.ts';
      import { renderShareMonth, shareMonthLayout } from '../shareMonth.ts';
      import { tabBar } from '../tabBar.ts';
      import {
        FIX_MONTH,
        FIX_MONTH_SCORE,
        FIX_TODAY,
        FIX_WEEK,
        fixName,
        fixtureMonth,
      } from './calendarFixture.ts';

      const q = new URLSearchParams(location.search);
      const view = q.get('view') ?? 'month';
      const app = document.getElementById('app');
      const days = fixtureMonth();
      const tabs = () => {
        try {
          return tabBar('calendar', () => {});
        } catch {
          return null;
        }
      };
      const log = (...a) => (window.harnessLog = [...(window.harnessLog ?? []), a.join(' ')]);
      if (view === 'month') {
        app.replaceChildren(
          calendarScreen(
            {
              month: FIX_MONTH,
              today: FIX_TODAY,
              days,
              week: FIX_WEEK,
              monthScore: FIX_MONTH_SCORE,
              streakWeeks: 6,
              blockGroup: (id) => (id === 'b1' ? 'chest' : null),
              dayName: fixName,
              animate: q.get('animate') === '1',
              tabs: tabs(),
            },
            {
              onPrevMonth: () => log('prev'),
              onNextMonth: () => log('next'),
              onOpenDay: (d) => log('open', d),
              onShare: () => log('share'),
            },
          ),
        );
      } else if (view === 'day') {
        const date = q.get('date') ?? FIX_TODAY;
        app.replaceChildren(
          calendarDayScreen(
            {
              day: days.find((d) => d.date === date),
              today: FIX_TODAY,
              dayName: fixName,
              name: fixName,
              focusGroup: 'chest',
              isFocus: (id) => id === 'bench' || id === 'pushup',
              tabs: tabs(),
            },
            {
              onBack: () => log('back'),
              onStart: () => log('start'),
              onMove: (d) => log('move', d),
              onDoToday: (d) => log('doToday', d),
              onHistory: (id) => log('history', id),
            },
          ),
        );
      } else {
        const layout = shareMonthLayout(FIX_MONTH, days, {
          month: FIX_MONTH_SCORE,
          streakWeeks: 6,
        });
        const blob = await renderShareMonth(layout);
        const url = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Share month image';
        img.style.width = '100%';
        app.replaceChildren(img);
        const buf = new Uint8Array(await blob.arrayBuffer());
        let bin = '';
        for (const b of buf) bin += String.fromCharCode(b);
        window.sharePng = btoa(bin);
      }
      window.harnessReady = true;
    </script>
  </body>
</html>
