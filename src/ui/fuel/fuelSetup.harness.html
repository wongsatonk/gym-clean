<!doctype html>
<!-- Dev-only visual check for M13d tasks 8, 13 and 3b (Set up Fuel), made-up values, dark theme.
     Not part of the build or the app. Open on the dev server: /src/ui/fuel/fuelSetup.harness.html
     ?v=prefill  first run, Apple Health filled height / birth year / sex and the weigh-in (cm, kg),
                 with the first run's quiet "Not now".
     ?v=ftin     height in ft + in (lb), nothing from Health.
     window.harnessEvents: what the form called back ('save' with its values, 'notNow', 'touch').
     e2e/fuel-setup-prefill.spec.ts tests it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Set up Fuel harness</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import '@fontsource/barlow-condensed/latin-700.css';
      import { fuelSetupScreen } from './setup.ts';

      window.harnessEvents = [];
      const v = new URLSearchParams(location.search).get('v') ?? 'prefill';
      const push = (e) => window.harnessEvents.push(e);
      const props =
        v === 'ftin'
          ? { year: 2026, unit: 'lb', lengthUnit: 'in', initial: { heightCm: 170 } }
          : {
              year: 2026,
              unit: 'kg',
              lengthUnit: 'cm',
              initial: { heightCm: 165, birthYear: 1991, sex: 'female', weightKg: 61.2 },
              fromHealth: new Set(['height', 'birthYear', 'sex', 'weight']),
            };
      document.getElementById('app').replaceChildren(
        fuelSetupScreen(props, {
          onSave: (values) => push(['save', values]),
          onCancel: () => push(['back']),
          onTouch: () => push(['touch']),
          ...(v === 'prefill' ? { onNotNow: () => push(['notNow']) } : {}),
        }),
      );
    </script>
  </body>
</html>
